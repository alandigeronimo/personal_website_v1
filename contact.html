<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alan Di Geronimo</title>
    <link rel="stylesheet" href="css/style.css?v=pcwhite1" />
  </head>
  <body>
    <header class="site-header">
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="journey.html">Journey</a></li>
          <li><a href="work.html">Work</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="page-intro">
      <h1>Let's connect.</h1>
      <p>Always happy to meet new people, exchange ideas, or just say hello.</p>
    </section>

    <section class="contact-section">
      <!-- The wrapper keeps the instruction and the postcard the same width, so the instruction lines up with the postcard's right edge -->
      <div class="postcard-wrap">
        <p class="postcard-hint">Click to flip the postcard <span aria-hidden="true">↻</span></p>
        <div class="postcard-lift">
          <div class="postcard" id="postcard">

            <!-- FRONT -->
            <div class="postcard-face postcard-front" id="postcard-front">
              <!-- The photo on the front. To use a different picture, change the file name in src. -->
              <img class="postcard-photo" src="assets/images/contact/nyc-postcard.jpg" alt="New York City skyline" />
              <p class="postcard-phrase">Let's see where this goes.</p>
              <!-- An invisible button covering the whole front, so the postcard works with mouse and keyboard -->
              <button class="flip-front-button" id="flip-front" type="button" aria-label="Flip the postcard to write a message"></button>
            </div>

            <!-- BACK: the contact form -->
            <div class="postcard-face postcard-back" id="postcard-back">
              <!-- Stamp (decoration only) -->
              <img class="postcard-stamp" src="assets/images/contact/statue-liberty-stamp.png" alt="" />

              <!--
                Messages are emailed to adigeronimo19@gmail.com through Web3Forms.
                JavaScript posts the form so this page can show success or error
                without leaving the postcard. The public access key lives in js/contact.js.
              -->
              <form class="postcard-form" id="postcard-form" action="https://api.web3forms.com/submit" method="post">
                <!-- Left half: the message -->
                <div class="postcard-message">
                  <label class="visually-hidden" for="message">Your message</label>
                  <textarea id="message" name="message" placeholder="Your message…" required></textarea>
                  <button class="flip-back" id="flip-back" type="button">
                    <span aria-hidden="true">↻</span> Flip back
                  </button>
                </div>

                <!-- Right half: name, email, and the send button -->
                <div class="postcard-fields">
                  <div class="postcard-field">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" autocomplete="name" required />
                  </div>
                  <div class="postcard-field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required />
                  </div>
                  <input type="hidden" name="replyto" id="postcard-replyto" value="" />
                  <input type="hidden" name="subject" id="postcard-subject" value="Website postcard" />
                  <input class="visually-hidden" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" />
                  <button class="postcard-send" type="submit">Send Postcard</button>
                  <p class="postcard-status" id="postcard-status" role="status"></p>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>

      <!-- Direct contact links. Their addresses come from assets/data/personal/contact.js -->
      <div class="direct-contact">
        <h2 class="direct-heading">Or reach me directly</h2>
        <ul class="direct-links">
          <li>
            <a class="direct-link" href="#" data-contact="email" aria-label="Email Alan Di Geronimo">
              <span class="direct-icon-wrap" aria-hidden="true"><svg class="direct-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg></span>
              <span>Email</span>
            </a>
          </li>
          <li>
            <a
              class="direct-link"
              href="#"
              data-contact="linkedin"
              target="_blank"
              rel="noopener"
              aria-label="Visit Alan Di Geronimo's LinkedIn (opens in a new tab)"
            >
              <span class="direct-icon-wrap" aria-hidden="true"><svg class="direct-icon direct-icon-fill" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452z" />
              </svg></span>
              <span>LinkedIn</span>
            </a>
          </li>
          <li>
            <a
              class="direct-link"
              href="#"
              data-contact="github"
              target="_blank"
              rel="noopener"
              aria-label="Visit Alan Di Geronimo's GitHub (opens in a new tab)"
            >
              <span class="direct-icon-wrap" aria-hidden="true"><svg class="direct-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
              </svg></span>
              <span>GitHub</span>
            </a>
          </li>
        </ul>
      </div>
    </section>

    <script src="assets/data/personal/contact.js?v=pub1"></script>
    <script src="js/contact.js?v=w3f2"></script>
  </body>
</html>
